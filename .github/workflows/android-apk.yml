name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android-apk.yml'
      - 'package.json'
      - 'public/**'
      - 'src/**'
      - 'src-tauri/**'
      - 'vite.config.ts'
      - 'tsconfig*.json'
  push:
    branches:
      - agent/initial-local-first-mapping-app
    paths:
      - '.github/workflows/android-apk.yml'
      - 'package.json'
      - 'public/**'
      - 'src/**'
      - 'src-tauri/**'
      - 'vite.config.ts'
      - 'tsconfig*.json'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 28.2.13676358

jobs:
  build-apk:
    name: ARM Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform, build tools, and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend and Tauri dependencies
        run: npm install

      - name: Validate frontend
        run: npm run check

      - name: Generate native application icons
        run: npm run tauri icon public/icon.svg

      - name: Initialize generated Android project
        run: npm run tauri android init -- --ci --skip-targets-install

      - name: Build installable ARM APK
        shell: bash
        run: |
          set -o pipefail
          npm run tauri android build -- --debug --apk --target aarch64 --target armv7 --ci 2>&1 | tee android-build.log

      - name: Collect installable APK
        if: success()
        shell: bash
        run: |
          APK_PATH="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | sort | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" BFID-Mapping-debug.apk
          sha256sum BFID-Mapping-debug.apk > BFID-Mapping-debug.apk.sha256

      - name: Upload workflow APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bfid-mapping-android-apk
          path: |
            BFID-Mapping-debug.apk
            BFID-Mapping-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling Android test release
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: BFID Mapping Android test build
          body: |
            Installable debug-signed ARM APK built from the active BFID Mapping application branch.
            Supports aarch64 and armv7 Android devices.
          prerelease: true
          make_latest: false
          files: |
            BFID-Mapping-debug.apk
            BFID-Mapping-debug.apk.sha256

      - name: Write build status
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          {
            echo '# Android APK Build Status'
            echo
            echo "- Result: **${{ job.status }}**"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Finished: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            if [ -f BFID-Mapping-debug.apk ]; then
              echo "- APK bytes: $(stat -c '%s' BFID-Mapping-debug.apk)"
              echo "- SHA-256: \`$(cut -d' ' -f1 BFID-Mapping-debug.apk.sha256)\`"
              echo "- Release tag: \`android-latest\`"
            else
              echo
              echo '## Build log tail'
              echo '```text'
              tail -n 100 android-build.log 2>/dev/null || echo 'Android build did not start or no log was produced.'
              echo '```'
            fi
          } > APK_STATUS.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add APK_STATUS.md
          git commit -m 'Report Android APK build result' || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
