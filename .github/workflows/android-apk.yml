name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/initial-local-first-mapping-app
    paths:
      - '.github/workflows/android-apk.yml'
      - 'package.json'
      - 'public/**'
      - 'src/**'
      - 'src-tauri/**'
      - 'vite.config.ts'
      - 'tsconfig*.json'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 28.2.13676358

jobs:
  build-apk:
    name: ARM Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform, build tools, and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend and Tauri dependencies
        run: npm install

      - name: Validate frontend
        run: npm run check

      - name: Generate native application icons
        run: npm run tauri icon public/icon.svg

      - name: Initialize generated Android project
        run: npm run tauri android init -- --ci --skip-targets-install

      - name: Build installable ARM APK
        run: npm run tauri android build -- --debug --apk --target aarch64 --target armv7 --ci

      - name: List generated Android packages
        if: always()
        shell: bash
        run: find src-tauri/gen/android/app/build/outputs -type f 2>/dev/null | sort || true

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: bfid-mapping-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
