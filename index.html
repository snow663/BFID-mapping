<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#102b1f" />
    <meta name="description" content="Local-first field mapping for the Belle Fourche Irrigation District" />
    <link rel="icon" href="./icon.svg" />
    <title>BFID Mapping</title>
    <style>
      #bfid-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #091611;
        color: #edf4ef;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #bfid-boot > div {
        width: min(620px, 100%);
        padding: 18px;
        border: 1px solid #395246;
        border-radius: 12px;
        background: #102b1f;
      }
      #bfid-boot strong { display: block; margin-bottom: 8px; font-size: 18px; }
      #bfid-boot pre {
        max-height: 55vh;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: #b9c9bf;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #bfid-boot.failed > div { border-color: #b46d56; background: #241813; }
      #bfid-boot.failed strong { color: #ffd0c2; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="bfid-boot" role="status" aria-live="polite">
      <div>
        <strong data-boot-heading>Starting BFID Mapping…</strong>
        <pre data-boot-detail>Loading the local application bundle.</pre>
      </div>
    </div>
    <script>
      (function () {
        var timer = window.setTimeout(function () {
          var boot = document.getElementById('bfid-boot');
          if (!boot) return;
          boot.className = 'failed';
          var heading = boot.querySelector('[data-boot-heading]');
          var detail = boot.querySelector('[data-boot-detail]');
          if (heading) heading.textContent = 'BFID Mapping startup stalled';
          if (detail) detail.textContent = 'The Android WebView loaded the page, but the application bundle did not finish starting within 15 seconds.';
        }, 15000);

        window.addEventListener('error', function (event) {
          window.clearTimeout(timer);
          var boot = document.getElementById('bfid-boot');
          if (!boot) return;
          boot.className = 'failed';
          var heading = boot.querySelector('[data-boot-heading]');
          var detail = boot.querySelector('[data-boot-detail]');
          var source = event && event.filename ? '\n' + event.filename + ':' + (event.lineno || 0) : '';
          if (heading) heading.textContent = 'BFID Mapping startup error';
          if (detail) detail.textContent = (event && event.message ? event.message : 'A startup resource failed to load.') + source;
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          window.clearTimeout(timer);
          var boot = document.getElementById('bfid-boot');
          if (!boot) return;
          boot.className = 'failed';
          var heading = boot.querySelector('[data-boot-heading]');
          var detail = boot.querySelector('[data-boot-detail]');
          var reason = event && event.reason;
          if (heading) heading.textContent = 'BFID Mapping startup rejection';
          if (detail) detail.textContent = reason && reason.stack ? reason.stack : String(reason || 'Unknown rejected startup operation.');
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
