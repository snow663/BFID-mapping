<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#102b1f" />
    <meta name="description" content="Local-first field mapping for the Belle Fourche Irrigation District" />
    <link rel="icon" href="./icon.svg" />
    <title>BFID Mapping</title>
    <style>
      #bfid-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #091611;
        color: #edf4ef;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #bfid-boot > div {
        width: min(620px, 100%);
        padding: 18px;
        border: 1px solid #395246;
        border-radius: 12px;
        background: #102b1f;
      }
      #bfid-boot strong { display: block; margin-bottom: 8px; font-size: 18px; }
      #bfid-boot pre {
        max-height: 55vh;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: #b9c9bf;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #bfid-boot.failed > div { border-color: #b46d56; background: #241813; }
      #bfid-boot.failed strong { color: #ffd0c2; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="bfid-boot" role="status" aria-live="polite">
      <div>
        <strong data-boot-heading>Starting BFID Mapping…</strong>
        <pre data-boot-detail>Android page loaded. Waiting for the application JavaScript.</pre>
      </div>
    </div>
    <script>
      (function () {
        var startedAt = Date.now();
        var state = window.__BFID_BOOT__ = window.__BFID_BOOT__ || {};
        var intervalId;

        function elements() {
          var boot = document.getElementById('bfid-boot');
          return {
            boot: boot,
            heading: boot && boot.querySelector('[data-boot-heading]'),
            detail: boot && boot.querySelector('[data-boot-detail]')
          };
        }

        function fail(title, message) {
          var parts = elements();
          if (!parts.boot) return;
          parts.boot.className = 'failed';
          if (parts.heading) parts.heading.textContent = title;
          if (parts.detail) parts.detail.textContent = message;
          if (intervalId) window.clearInterval(intervalId);
        }

        function tick() {
          var parts = elements();
          if (!parts.boot || state.ready) {
            if (intervalId) window.clearInterval(intervalId);
            return;
          }

          var elapsedSeconds = Math.floor((Date.now() - startedAt) / 1000);
          var stage = state.stage || 'Android page loaded. Waiting for the application JavaScript.';
          if (parts.detail) parts.detail.textContent = stage + '\n\nElapsed: ' + elapsedSeconds + ' seconds';

          if (elapsedSeconds >= 20) {
            fail(
              'BFID Mapping startup stalled',
              stage + '\n\nThe last startup phase did not finish within 20 seconds.'
            );
          }
        }

        window.addEventListener('error', function (event) {
          var target = event && event.target;
          var resource = target && (target.src || target.href);
          var source = event && event.filename ? '\n' + event.filename + ':' + (event.lineno || 0) : '';
          fail(
            'BFID Mapping startup error',
            event && event.message
              ? event.message + source
              : resource
                ? 'A startup resource failed to load:\n' + resource
                : 'A startup resource failed to load.'
          );
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          fail(
            'BFID Mapping startup rejection',
            reason && reason.stack ? reason.stack : String(reason || 'Unknown rejected startup operation.')
          );
        });

        tick();
        intervalId = window.setInterval(tick, 1000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
